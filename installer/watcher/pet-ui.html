      const colors = ['#ffb300', '#ff8f00', '#ff7043', '#f4511e', '#ffc400', '#ffd54f', '#ec4899', '#a855f7'];
      const parts = [];
      for (let i = 0; i < 24; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 130 + Math.random() * 340;
        const rad = 3 + Math.random() * 4.5;
        const el = document.createElement('div');
        el.className = 'pet-score-particle';
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.width = (rad * 2) + 'px';
        el.style.height = (rad * 2) + 'px';
        el.style.background = colors[i % colors.length];
        burst.appendChild(el);
        parts.push({ el, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd - 95, t0: performance.now(), life: 520 + Math.random() * 360 });
      }
      const stepBurst = () => {
        const now = performance.now();
        let alive = false;
        for (const p of parts) {
          const lr = (now - p.t0) / p.life;
          if (lr >= 1) continue;
          alive = true;
          const ts = (now - p.t0) / 1000;
          p.el.style.transform = `translate(${(p.vx * ts).toFixed(1)}px, ${(p.vy * ts + 360 * ts * ts).toFixed(1)}px)`;
          p.el.style.opacity = String(Math.max(0, 1 - lr));
        }
        if (alive) requestAnimationFrame(stepBurst);
        else burst.remove();
      };
      requestAnimationFrame(stepBurst);

      if (state.scorePopupEl) { try { state.scorePopupEl.remove(); } catch {} }
      if (state.scorePopupTimer) clearTimeout(state.scorePopupTimer);
      const pop = document.createElement('div');
      pop.className = 'pet-score-popup';
      const recBadge = isNewRecord ? '<span class="pet-score-rec">👑 新纪录!</span>' : '';
      pop.innerHTML = `<div class="pet-score-val">+${score}${recBadge}</div><div class="pet-score-sub">空抓 ${Math.round(speed)}px/s · 最高 ${bestScore}</div>`;
      document.body.appendChild(pop);
      const rr = pop.getBoundingClientRect();
      pop.style.left = Math.max(8, Math.min(x - rr.width / 2, window.innerWidth - rr.width - 8)) + 'px';
      pop.style.top = Math.max(8, y - rr.height - 16) + 'px';
      state.scorePopupEl = pop;
      requestAnimationFrame(reportHitRects);
      state.scorePopupTimer = setTimeout(() => {
        if (state.scorePopupEl) {
          state.scorePopupEl.remove();
          state.scorePopupEl = null;
          requestAnimationFrame(reportHitRects);
        }
      }, 2400);
    }

    // ── 双击弹弓瞄准线与蓄力 HUD ──
    function updateSlingshotHud(active, pullDx, pullDy, pct) {
      state.slingshotActive = Boolean(active);
      if (!active) {
        slingshotHud.classList.remove('is-on');
        state.squashX = 1;
        state.squashY = 1;
        applyBodyTransform();
        return;
      }
      slingshotHud.classList.add('is-on');
      const p = Math.max(0, Math.min(100, Number(pct) || 0));
      const color = p >= 75 ? '#ef4444' : p >= 40 ? '#f59e0b' : '#a855f7';
      slingshotBadge.textContent = `🏹 弹弓蓄力 ${Math.round(p)}%`;
      slingshotBadge.style.borderColor = color;
      slingshotBadge.style.color = p >= 75 ? '#fecaca' : '#fde68a';

      const cx = 160, cy = 112;
      const dist = Math.hypot(pullDx, pullDy) || 1;
      const len = Math.min(110, 26 + p * 0.85);
      const ux = -pullDx / dist;
      const uy = -pullDy / dist;
      const tx = cx + ux * len;
      const ty = cy + uy * len;
      const bx = cx - ux * Math.min(44, len * 0.45);
      const by = cy - uy * Math.min(44, len * 0.45);
      slingshotSvg.innerHTML =
        `<line x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${cx}" y2="${cy}" stroke="${color}" stroke-width="3.5" stroke-linecap="round" opacity="0.72"/>` +
        `<line x1="${cx}" y1="${cy}" x2="${tx.toFixed(1)}" y2="${ty.toFixed(1)}" stroke="${color}" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>` +
        `<circle cx="${tx.toFixed(1)}" cy="${ty.toFixed(1)}" r="5" fill="${color}"/>`;

      // 蓄力压缩身体
      const sq = 1 - (p / 100) * 0.24;
      state.squashY = sq;
      state.squashX = 1 / Math.sqrt(Math.max(0.6, sq));
      applyBodyTransform();
    }

    // ── 悬停小名牌 Tooltip ──
    function updateHoverTooltip(on, physX, physY) {
      state.hovering = Boolean(on);
      if (!on || state.dragging || state.throwing || state.slingshotActive || state.todoOpen) {
        petTooltip.classList.remove('is-on');
        requestAnimationFrame(reportHitRects);
        return;
      }
      const dpr = window.devicePixelRatio || 1;
      const cx = physX / dpr;
      const cy = physY / dpr;
      const petName = state.prefs.petName || '星璃喵';
      const act = state.currentAnim ? ` · ${state.currentAnim}` : '';
      petTooltip.innerHTML = `🐾 ${petName}${act}<span class="tip-sub">S睡 D待办 W天气</span>`;
      petTooltip.classList.add('is-on');
      const r = petTooltip.getBoundingClientRect();
      const left = Math.max(6, Math.min(cx + 14, window.innerWidth - r.width - 6));
      const top = Math.max(6, Math.min(cy - r.height - 10, window.innerHeight - r.height - 6));
      petTooltip.style.left = left + 'px';
      petTooltip.style.top = top + 'px';
      requestAnimationFrame(reportHitRects);
    }

    // ── 精准命中区上报（紧贴宠物角色轮廓 + 全部可见气泡/面板/名牌，空白区域 100% 穿透） ──
    function reportHitRects() {
      // 投掷高速飞行期间跳过 Win32 Form.Region 重建，防止裁剪边与 DWM 合成帧错位产生残影
      if (state.throwing) return;
      const dpr = window.devicePixelRatio || 1;
      const rects = [];
      const addElRect = (el, kind = 'bubble') => {
        if (!el) return;
        const r = el.getBoundingClientRect();
        if (r.width > 0 && r.height > 0) {
          rects.push({
            kind,
            x: Math.round(r.left * dpr),
            y: Math.round(r.top * dpr),
            w: Math.round(r.width * dpr),
            h: Math.round(r.height * dpr),
          });
        }
      };

      const pr = (petWrap || petBody).getBoundingClientRect();
      if (pr.width > 0 && pr.height > 0) {
        rects.push({
          kind: 'pet',
          x: Math.round((pr.left + pr.width * 0.32) * dpr),
          y: Math.round((pr.top + pr.height * 0.16) * dpr),
          w: Math.round(pr.width * 0.36 * dpr),
          h: Math.round(pr.height * 0.78 * dpr),
        });
        rects.push({
          kind: 'petVisual',
          x: Math.round(pr.left * dpr),
          y: Math.round(pr.top * dpr),
          w: Math.round(pr.width * dpr),
          h: Math.round(pr.height * dpr),
        });
      }
      if (taskStack.classList.contains('is-on')) {
        const cards = taskStack.querySelectorAll('.task-card, .task-overflow-badge, .task-badge-item, .task-mode-orb, .task-badge-tooltip.is-on');
        for (const el of cards) addElRect(el, 'bubble');
      }
      if (whisperWrap.classList.contains('is-on')) addElRect(whisperWrap, 'bubble');
      if (weatherCard.classList.contains('is-on')) addElRect(weatherCard, 'bubble');
      if (todoPanel.classList.contains('is-on')) addElRect(todoPanel, 'bubble');
      if (petTooltip.classList.contains('is-on')) addElRect(petTooltip, 'bubble');
      if (state.scorePopupEl) addElRect(state.scorePopupEl, 'bubble');

      const rectsSig = rects.map((r) => `${r.kind}:${r.x},${r.y},${r.w},${r.h}`).join('|');
      if (rectsSig === state.lastHitRectsSig) return;
      state.lastHitRectsSig = rectsSig;
      postHost({ type: 'hitRects', rects });
    }

    whisperWrap.addEventListener('click', (ev) => {
      ev.stopPropagation();
      popWhisperBubble();
    });
    document.getElementById('weather-close-btn').addEventListener('click', (ev) => { ev.stopPropagation(); closeWeatherCard(); });
    document.getElementById('weather-refresh-btn').addEventListener('click', (ev) => { ev.stopPropagation(); playClickSound(0.35); fetchAndShowWeather(true, true); });
    document.getElementById('todo-close-btn').addEventListener('click', (ev) => { ev.stopPropagation(); closeTodoPanel(); });
    todoAddBtn.addEventListener('click', (ev) => { ev.stopPropagation(); addTodoFromInput(); });
    todoInput.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { ev.preventDefault(); addTodoFromInput(); }
      else if (ev.key === 'Escape') { ev.preventDefault(); closeTodoPanel(); }
    });
    todoDueRow.addEventListener('click', (ev) => {
      const chip = ev.target && ev.target.closest ? ev.target.closest('.todo-due-chip') : null;
      if (!chip) return;
      ev.stopPropagation();
      state.todoDuePreset = chip.getAttribute('data-due') || 'none';
      todoDueRow.querySelectorAll('.todo-due-chip').forEach((c) => c.classList.toggle('is-active', c === chip));
    });
    todoListEl.addEventListener('click', (ev) => {
      const btn = ev.target && ev.target.closest ? ev.target.closest('[data-todo-act]') : null;
      if (!btn) return;
      ev.stopPropagation();
      const act = btn.getAttribute('data-todo-act');
      const id = btn.getAttribute('data-todo-id');
      const idx = state.todos.findIndex((x) => x.id === id);
      if (idx < 0) return;
      if (act === 'toggle') {
        state.todos[idx].done = !state.todos[idx].done;
        state.todoConfirmDelId = '';
        playClickSound(0.4);
        saveTodos();
        renderTodoList();
      } else if (act === 'delete') {
        if (state.todoConfirmDelId === id) {
          state.todos.splice(idx, 1);
          state.todoConfirmDelId = '';
          playClickSound(0.32);
          saveTodos();
          renderTodoList();
        } else {
          state.todoConfirmDelId = id;
          renderTodoList();
        }
      }
    });

    // ── 宿主调用入口（C# ExecuteScript） ──
    window.__petApi = {
      setSize(px) {
        const s = Math.max(200, Math.min(480, Number(px) || 320));
        state.petSize = s;
        const scale = Math.max(0.84, Math.min(1.28, s / 320));
        document.documentElement.style.setProperty('--pet-w', s + 'px');
        document.documentElement.style.setProperty('--pet-h', Math.round(s * 9 / 16) + 'px');
        document.documentElement.style.setProperty('--pet-scale', scale.toFixed(3));
        triggerSquash(0.76);
        requestAnimationFrame(reportHitRects);
      },
      setPrefs(p) {
        if (!p || typeof p !== 'object') return;
        const prevWorkAnim = state.prefs.workAnimEnabled;
        Object.assign(state.prefs, p);
        const rawFontKey = String(state.prefs.fontFamily || 'youyuan').toLowerCase();
        const fontKey = rawFontKey === 'candy' ? 'youyuan' : rawFontKey;
        document.documentElement.style.setProperty('--pet-font', FONT_STACKS[fontKey] || FONT_STACKS.youyuan);
        if (state.prefs.fixed) cancelMove();
        if (prevWorkAnim !== state.prefs.workAnimEnabled && !state.dragging) {
          advanceChain();
        }
        syncBubbles();
      },
      setDragging(isDrag) {
        const next = Boolean(isDrag);
        if (state.dragging === next) return;
        state.dragging = next;
        if (next) {
          updateHoverTooltip(false, 0, 0);
          cancelMove();
          // 对齐 dsh-pet 细节：睡着时轻轻挪动位置不惊醒她，维持可爱睡姿！
          if (state.sleepPhase === 'sleeping' || state.sleepPhase === 'starting') return;
          const dragAnim = pickFrom(ANIM_CFG.drag);
          if (dragAnim) switchAnim(dragAnim, false);
        } else {
          if (state.sleepPhase === 'sleeping' || state.sleepPhase === 'starting') return;
          triggerSquash(0.68);
          const work = resolveWorkAnim();
          if (work) switchAnim(work.name, work.once, () => advanceChain());
          else switchAnim(pickFrom(ANIM_CFG.idle), true);
        }
      },
      setSlingshot(active, pullDx, pullDy, pct) {
        if (active) updateHoverTooltip(false, 0, 0);
        updateSlingshotHud(active, pullDx, pullDy, pct);
      },
      setHover(on, physX, physY) {
        updateHoverTooltip(on, physX, physY);
      },
      onAirCatchScore(physX, physY, score, speed, petSize, isNewRecord, bestScore) {
        updateHoverTooltip(false, 0, 0);
        spawnAirCatchScore(physX, physY, score, speed, petSize, isNewRecord, bestScore);
      },
      showWeather(force = true) {
        playClickSound(0.36);
        fetchAndShowWeather(true, Boolean(force));
      },
      toggleTodoPanel() {
        playClickSound(0.36);
        if (state.todoOpen) closeTodoPanel();
        else openTodoPanel();
      },
      setThrowing(isThrow) {
        const next = Boolean(isThrow);
        state.throwing = next;
        if (next) {
          state.dragging = false;
          updateHoverTooltip(false, 0, 0);
          playClickSound(0.5);
          document.body.classList.add('is-throwing');
        } else {
          document.body.classList.remove('is-throwing');
          if (!state.dragging) {
            advanceChain();
          }
          requestAnimationFrame(reportHitRects);
        }
      },
      // facingRight: false = 原样朝左 (left), true = 水平镜像朝右 (right)
      setFacing(facingRight) {
        state.facingRight = Boolean(facingRight);
        applyBodyTransform();
      },
      squash(amount = 0.66) {
        if (amount <= 0.72) playClickSound(0.32);
        triggerSquash(amount);
      },
      toggleSleep() {
        playClickSound(0.36);
        if (state.sleepPhase === 'awake' || state.sleepPhase === 'waking') {
          enterSleepMode();
        } else {
          wakeFromSleepMode(false);
        }
      },
      playBalance(usedPct, quotaSummary) {
        playClickSound(0.38);
        const p = Number.isFinite(Number(usedPct)) && Number(usedPct) >= 0 ? Math.max(0, Math.min(100, Math.round(Number(usedPct)))) : 25;
        const rem = Math.max(0, 100 - p);
        const idx = p >= 100 ? 5 : Math.floor(p / 20);
        const anim = ANIM_CFG.balanceAnims[idx] || ANIM_CFG.balanceAnims[0];
        const info = BALANCE_TIER_TEXTS[idx] || BALANCE_TIER_TEXTS[0];
        const summaryLine = (typeof quotaSummary === 'string' && quotaSummary.trim())
          ? quotaSummary.trim()
          : `【当前额度】\n已用 ${p}% · 剩余 ${rem}%`;
        const formattedHead = summaryLine.startsWith('【') ? summaryLine : `【${summaryLine}】`;
        if (state.sleepPhase !== 'awake') {
          triggerSquash(0.84);
          showWhisper(`${formattedHead}\n${info.text}`, 'sleep', 6800, true);
          return;
        }
        cancelMove();
        triggerSquash(0.74);
        showWhisper(`${formattedHead}\n${info.text}`, info.meme, 6800, true);
        if (hasAnim(anim)) {
          state.lastPicked = anim;
          switchAnim(anim, true, () => advanceChain());
        }
      },
      onPoke(isTickle) {
        if (state.dragging) return;
        playClickSound(0.48);
        if (state.sleepPhase === 'sleeping' || state.sleepPhase === 'starting') {
          triggerSquash(0.84);
          const refuse = SLEEP_REFUSE_TEXTS[Math.floor(Math.random() * SLEEP_REFUSE_TEXTS.length)];
          showWhisper(refuse, 'sleep', 3600, true);
          return;
        }
        cancelMove();
        triggerSquash(0.64);
        if (isTickle && hasAnim('点击回应-挠痒咯咯笑')) {
          switchAnim('点击回应-挠痒咯咯笑', true);
          showWhisper('呀~ 好痒好痒别一直戳人家啦！(⁄ ⁄•⁄ω⁄•⁄ ⁄)', 'cute', 4200, true);
          return;
        }
        const anim = pickFrom(ANIM_CFG.clicks, state.lastClickAnim);
        if (anim) {
          state.lastClickAnim = anim;
          switchAnim(anim, true);
        }
        if (state.prefs.chatterEnabled && Math.random() < 0.45) {
          const item = pickTimeAwareChatter(Math.random() < 0.65);
          showWhisper(item.text, item.meme, 4800);
        }
      },
      // 选中某个动作仅生效一次，播完后自动切回随机动作链
      playAction(name) {
        cancelMove();
        if (!name) {
          if (state.sleepPhase !== 'awake') wakeFromSleepMode(false);
          else advanceChain();
          return;
        }
        if (name === ANIM_CFG.sleep.start || name === ANIM_CFG.sleep.loop) {
          enterSleepMode();
          return;
        }
        if (name === ANIM_CFG.sleep.end) {
          if (state.sleepPhase !== 'awake') wakeFromSleepMode(false);
          else if (hasAnim(name)) switchAnim(name, true, () => advanceChain());
          return;
        }
        if (state.sleepPhase !== 'awake') wakeFromSleepMode(true);
        const mv = ANIM_CFG.moves.find((m) => m.name === name);
        if (mv) {
          startMoveAction(mv);
          return;
        }
        if (name === '东张西望') {
          switchAnim(name, true, () => {
            state.facingRight = !state.facingRight;
            applyBodyTransform();
            advanceChain();
          });
          return;
        }
        if (hasAnim(name)) {
          if (ANIM_CFG.noMirrorAnims.has(name) && state.facingRight) {
            state.facingRight = false;
            applyBodyTransform();
          }
          triggerSquash(0.76);
          state.lastPicked = name;
          switchAnim(name, true, () => advanceChain());
        }
      },
      showNotice(text, memeKey) {
        if (!text) return;
        triggerSquash(0.76);
        showWhisper(String(text), memeKey || 'ciallo', 5600, true);
      },
      triggerChatter() {
        playClickSound(0.38);
        if (state.sleepPhase === 'sleeping' || state.sleepPhase === 'starting') {
          const refuse = SLEEP_REFUSE_TEXTS[Math.floor(Math.random() * SLEEP_REFUSE_TEXTS.length)];
          showWhisper(refuse, 'sleep', 3800, true);
          return;
        }
        const item = pickTimeAwareChatter(true);
        showWhisper(item.text, item.meme, 5600, true);
        triggerSquash(0.76);
        if (!state.dragging && !state.telemetry.running) {
          const wAnim = pickFrom(ANIM_CFG.whisperAnims, state.lastWhisperAnim);
          if (wAnim) {
            cancelMove();
            state.lastWhisperAnim = wAnim;
            switchAnim(wAnim, true, () => advanceChain());
          }
        }
      },
      clearBubbleHover() {
        const had = Boolean(state.hoveredBadgeId) || Boolean(badgeTooltipEl && badgeTooltipEl.classList.contains('is-on'));
        state.hoveredBadgeId = '';
        if (badgeTooltipEl) {
          badgeTooltipEl.classList.remove('is-on');
        }
        if (had) requestAnimationFrame(reportHitRects);
      },
      handleBubbleClick(physX, physY) {
        if (state.lastHandledClickMs && Date.now() - state.lastHandledClickMs < 180) return;
        state.lastHandledClickMs = Date.now();
        const dpr = window.devicePixelRatio || 1;
        const cx = physX / dpr;
        const cy = physY / dpr;
        const el = document.elementFromPoint(cx, cy);
        if (!el) return;
        if (el.closest && el.closest('#todo-panel')) {
          if (el.closest('#todo-input')) {
            postHost({ type: 'focusInput', active: true });
            try { todoInput.focus(); } catch {}
          }
          return;
        }
        if (el.closest && el.closest('#weather-card')) {
          if (el.closest('#weather-close-btn')) closeWeatherCard();
          else if (el.closest('#weather-refresh-btn')) fetchAndShowWeather(true, true);
          return;
        }
        if (el.closest && el.closest('#whisper-wrap')) {
          popWhisperBubble();
          return;
        }
        if (el.closest && el.closest('[data-bubble-act="toggle-compact"]')) {
          toggleCompactTaskMode();
          return;
        }
        const badgeEl = el.closest ? el.closest('.task-badge-item') : null;
        if (badgeEl) {
          const bId = badgeEl.getAttribute('data-task-id') || '';
          const bRec = taskBadgeMap.get(bId);
          if (bRec && bRec.item) {
            activateAndMaybeDismissTask(bRec.item);
          }
          return;
        }
        const cardEl = el.closest ? el.closest('.task-card') : null;
        if (!cardEl) return;
        const taskId = cardEl.getAttribute('data-task-id') || '';
        const rec = taskCardMap.get(taskId);
        const cur = rec ? rec.item : null;
        if (!cur) return;
        if (el.closest('[data-bubble-act="dismiss"]')) {
          dismissTaskImmediately(cur);
          return;
        }
        if (el.closest('[data-bubble-act="toggle"]')) {
          if (state.expandedTaskIds.has(cur.id)) state.expandedTaskIds.delete(cur.id);
          else state.expandedTaskIds.add(cur.id);
          syncBubbles(true);
          return;
        }
        activateAndMaybeDismissTask(cur);
      },
      applyTelemetry(t) {
        if (!t || typeof t !== 'object') return;
        const prevState = state.telemetry.workState;
        const prevDone = state.telemetry.doneState;
        const tasks = Array.isArray(t.tasks) ? t.tasks : [];
        state.telemetry = {
          running: Boolean(t.running),
          workState: String(t.workState || (t.running ? 'working' : t.doneState || 'idle')),
          doneState: String(t.doneState || ''),
          tasks,
        };
        syncBubbles();

        if (state.prefs.workAnimEnabled && !state.dragging && !state.throwing && state.sleepPhase === 'awake') {
          const ws = state.telemetry.workState;
          if (state.telemetry.running) {
            if ((ws === 'thinking' || ws === 'working' || ws === 'waiting') && prevState !== ws) {
              cancelMove();
              const work = resolveWorkAnim();
              if (work) switchAnim(work.name, work.once, () => advanceChain());
            }
          } else if (state.telemetry.doneState === 'done' && prevDone !== 'done') {
            cancelMove();
            triggerSquash(0.62);
            const doneAnim = pickFrom(ANIM_CFG.workStatus.done) || '点击回应-开心跃动';
            switchAnim(doneAnim, true, () => advanceChain());
          } else if (state.telemetry.doneState === 'error' && prevDone !== 'error') {
            cancelMove();
            triggerSquash(0.66);
            const errAnim = pickFrom(ANIM_CFG.workStatus.error) || '被吓一跳';
            switchAnim(errAnim, true, () => advanceChain());
          } else if ((prevState === 'thinking' || prevState === 'working' || prevState === 'waiting') && !state.telemetry.running && !state.telemetry.doneState) {
            advanceChain();
          }
        }
      },
      reportHitRects,
    };

    async function boot() {
      try {
        const [animsRes, memesRes] = await Promise.all([
          fetch('/api/anims').then((r) => r.json()).catch(() => []),
          fetch('/api/memes').then((r) => r.json()).catch(() => ({})),
          loadTodos(),
        ]);
        const list = Array.isArray(animsRes) ? animsRes : [];
        const known = new Set([
          ...ANIM_CFG.idle,
          ...ANIM_CFG.turn,
          ...ANIM_CFG.drag,
          ...ANIM_CFG.clicks,
          ...ANIM_CFG.moves.map((m) => m.name),
          ...ANIM_CFG.categories.flatMap((c) => c.actions),
          ...Object.values(ANIM_CFG.workStatus).flat(),
          ...ANIM_CFG.whisperAnims,
          ...ANIM_CFG.balanceAnims,
          ANIM_CFG.sleep.start,
          ANIM_CFG.sleep.loop,
          ANIM_CFG.sleep.end,
        ]);
        for (const name of list) {
          state.available.add(name);
          if (!known.has(name)) state.customExtras.push(name);
        }
        state.memes = memesRes && typeof memesRes === 'object' ? memesRes : {};
      } catch {}

      document.documentElement.style.setProperty('--pet-w', state.petSize + 'px');
      document.documentElement.style.setProperty('--pet-h', Math.round(state.petSize * 9 / 16) + 'px');

      await switchAnim(pickFrom(ANIM_CFG.idle), true);
      if (hasAnim('被鼠标拖拽悬空反馈')) {
        getBlobUrl('被鼠标拖拽悬空反馈').catch(() => {});
      }
      scheduleNextChatter();
      // 后台静默预热一次天气，供雨天/降温贴心提醒
      setTimeout(() => fetchAndShowWeather(false, false), 6000);
      reportHitRects();
      const activeVid = state.frontIdx === 0 ? vidA : vidB;
      postHost({
        type: 'ready',
        anims: Array.from(state.available),
        videoW: activeVid ? activeVid.videoWidth : 0,
        videoH: activeVid ? activeVid.videoHeight : 0,
        readyState: activeVid ? activeVid.readyState : 0,
      });
    }

    window.addEventListener('resize', () => { state.lastHitRectsSig = ''; requestAnimationFrame(reportHitRects); });
    if (typeof ResizeObserver === 'function') {
      const bubbleAnchor = document.getElementById('bubble-anchor');
      if (bubbleAnchor) {
        new ResizeObserver(() => requestAnimationFrame(reportHitRects)).observe(bubbleAnchor);
      }
    }
    boot();
  })();
  </script>
</body>
</html>
