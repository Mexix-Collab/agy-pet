<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 184" width="880" height="184" role="img" aria-label="AGY Pet 5 Core Interactive Features">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B1633"/>
      <stop offset="100%" stop-color="#120F22"/>
    </linearGradient>
    <linearGradient id="pill1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="pill2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Task Stack -->
  <g transform="translate(8, 8)">
    <rect width="164" height="168" rx="14" fill="url(#cbg)" stroke="#818CF8" stroke-opacity="0.32"/>
    <rect x="12" y="12" width="140" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="24" cy="22" r="3" fill="#34D399"/>
    <text x="86" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#A5B4FC">Task Stack</text>
    <!-- Mini capsules -->
    <rect x="16" y="44" width="132" height="22" rx="11" fill="#1F2937" stroke="#34D399" stroke-opacity="0.65"/>
    <circle cx="27" cy="55" r="3.5" fill="#34D399"/>
    <rect x="36" y="51" width="72" height="8" rx="4" fill="#E2E8F0" opacity="0.85"/>
    <rect x="114" y="49" width="26" height="12" rx="6" fill="#065F46"/>
    <rect x="16" y="72" width="132" height="22" rx="11" fill="#1F1A3A" stroke="#A78BFA" stroke-opacity="0.7"/>
    <circle cx="27" cy="83" r="3.5" fill="#A78BFA"/>
    <rect x="36" y="79" width="84" height="8" rx="4" fill="#EDE9FE" opacity="0.85"/>
    <text x="82" y="126" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">多会话任务胶囊</text>
    <text x="82" y="148" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="10.5" fill="#94A3B8">点击直达对话 · 后台一键唤醒</text>
  </g>

  <!-- Card 2: Custom Title & Chatter -->
  <g transform="translate(183, 8)">
    <rect width="164" height="168" rx="14" fill="url(#cbg)" stroke="#F472B6" stroke-opacity="0.32"/>
    <rect x="12" y="12" width="140" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="24" cy="22" r="3" fill="#F472B6"/>
    <text x="86" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FBCFE8">Custom Title</text>
    <!-- Bubble -->
    <rect x="18" y="46" width="128" height="44" rx="14" fill="#FFFDF9" stroke="#F9A8D4" stroke-width="1.3"/>
    <text x="82" y="65" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="11" font-weight="700" fill="#3B2F52">早安老大 ✦</text>
    <text x="82" y="81" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="9.5" fill="#6D5A80">今天写代码零 Bug 呀♪</text>
    <text x="82" y="126" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">专属称呼 &amp; 碎碎念</text>
    <text x="82" y="148" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="10.5" fill="#94A3B8">默认老大 · 8预设与自定义</text>
  </g>

  <!-- Card 3: Slingshot & Catch -->
  <g transform="translate(358, 8)">
    <rect width="164" height="168" rx="14" fill="url(#cbg)" stroke="#FBBF24" stroke-opacity="0.32"/>
    <rect x="12" y="12" width="140" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="24" cy="22" r="3" fill="#FBBF24"/>
    <text x="86" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#FDE68A">Physics Play</text>
    <!-- Arc + Score -->
    <path d="M28,88 Q82,36 134,68" fill="none" stroke="url(#pill2)" stroke-width="2.5" stroke-dasharray="5 4"/>
    <circle cx="134" cy="68" r="8" fill="#F59E0B"/>
    <rect x="46" y="42" width="72" height="22" rx="11" fill="#F59E0B" fill-opacity="0.2" stroke="#FBBF24"/>
    <text x="82" y="57" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="800" fill="#FDE68A">+256 PTS</text>
    <text x="82" y="126" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">弹弓发射 &amp; 空中抓分</text>
    <text x="82" y="148" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="10.5" fill="#94A3B8">弹簧拖拽 · 跨屏抛投互动</text>
  </g>

  <!-- Card 4: Weather & Todo -->
  <g transform="translate(533, 8)">
    <rect width="164" height="168" rx="14" fill="url(#cbg)" stroke="#38BDF8" stroke-opacity="0.32"/>
    <rect x="12" y="12" width="140" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="24" cy="22" r="3" fill="#38BDF8"/>
    <text x="86" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#BAE6FD">Weather &amp; Todo</text>
    <!-- Sun + Cloud + Check -->
    <circle cx="52" cy="62" r="12" fill="#FBBF24"/>
    <rect x="46" y="64" width="32" height="16" rx="8" fill="#E2E8F0"/>
    <text x="112" y="64" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#E0F2FE">22°C</text>
    <text x="112" y="82" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="10" fill="#7DD3FC">☑ 待办提醒</text>
    <text x="82" y="126" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">实时天气 &amp; 头顶待办</text>
    <text x="82" y="148" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="10.5" fill="#94A3B8">悬停按 W / D · 到期提醒</text>
  </g>

  <!-- Card 5: Dock Pet & agy-fast -->
  <g transform="translate(708, 8)">
    <rect width="164" height="168" rx="14" fill="url(#cbg)" stroke="#34D399" stroke-opacity="0.32"/>
    <rect x="12" y="12" width="140" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.06"/>
    <circle cx="24" cy="22" r="3" fill="#34D399"/>
    <text x="86" y="26" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#A7F3D0">Dock &amp; Fast</text>
    <!-- Mini pills -->
    <rect x="20" y="46" width="124" height="22" rx="11" fill="url(#pill1)" fill-opacity="0.3" stroke="#A78BFA"/>
    <text x="82" y="61" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="10.5" font-weight="600" fill="#EDE9FE">20 套趴框 / 坐姿伴侣</text>
    <rect x="20" y="74" width="124" height="22" rx="11" fill="#10B981" fill-opacity="0.2" stroke="#34D399"/>
    <text x="82" y="89" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#D1FAE5">⚡ agy-fast 加速</text>
    <text x="82" y="126" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">趴框伴侣 &amp; 省额加速</text>
    <text x="82" y="148" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="10.5" fill="#94A3B8">自动 /compact · 降轮次省额</text>
  </g>
</svg>
