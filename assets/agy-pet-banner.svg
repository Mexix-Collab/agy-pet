<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="AGY Pet — Transparent Desktop Pet &amp; Antigravity Companion Banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131024"/>
      <stop offset="55%" stop-color="#1E173B"/>
      <stop offset="100%" stop-color="#151229"/>
    </linearGradient>
    <linearGradient id="topAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#EDE9FE"/>
      <stop offset="100%" stop-color="#FBCFE8"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="0.22" cy="0.55" r="0.32">
      <stop offset="0%" stop-color="#A78BFA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="0.82" cy="0.45" r="0.30">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="880" height="220" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="880" height="220" fill="url(#bg)"/>
    <rect width="880" height="220" fill="url(#glowLeft)"/>
    <rect width="880" height="220" fill="url(#glowRight)"/>
    <rect x="0" y="0" width="880" height="4" fill="url(#topAccent)"/>

    <!-- Subtle starfield dots -->
    <g fill="#E9D5FF" opacity="0.35">
      <circle cx="48" cy="42" r="1.5"/>
      <circle cx="242" cy="36" r="1.8"/>
      <circle cx="315" cy="182" r="1.4"/>
      <circle cx="628" cy="38" r="1.6"/>
      <circle cx="662" cy="186" r="1.3"/>
      <circle cx="836" cy="34" r="1.7"/>
      <circle cx="812" cy="192" r="1.4"/>
    </g>

    <!-- Left: Desktop Pet Card + Floating Whisper Bubble + Task Pill -->
    <g transform="translate(34, 24)">
      <!-- Floating milk-white whisper bubble -->
      <rect x="14" y="0" width="186" height="32" rx="16" fill="#FFFDF9" stroke="#E9D5FF" stroke-width="1.4"/>
      <polygon points="94,32 104,32 99,39" fill="#FFFDF9"/>
      <text x="107" y="20" text-anchor="middle" font-family="'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="11.5" font-weight="600" fill="#3B2F52">收到！今天也陪老大写代码 ✦</text>

      <!-- Mini task progress capsule -->
      <rect x="10" y="44" width="194" height="24" rx="12" fill="#1E1B33" stroke="#6366F1" stroke-opacity="0.7" stroke-width="1.2"/>
      <circle cx="25" cy="56" r="4" fill="#34D399"/>
      <text x="36" y="60" font-family="'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="10.5" fill="#E2E8F0">多代理协作中 · 编译 0 错误</text>

      <!-- Pixel-inspired Chibi Heterochromia Neko Mascot -->
      <g transform="translate(56, 78)">
        <!-- Soft aura -->
        <ellipse cx="52" cy="86" rx="38" ry="8" fill="#A78BFA" opacity="0.22"/>
        <!-- Ears -->
        <polygon points="18,32 14,4 40,20" fill="url(#hairGrad)"/>
        <polygon points="86,32 90,4 64,20" fill="url(#hairGrad)"/>
        <polygon points="21,28 19,12 34,22" fill="#FBCFE8"/>
        <polygon points="83,28 85,12 70,22" fill="#FBCFE8"/>
        <!-- Hair silhouette -->
        <rect x="16" y="18" width="72" height="58" rx="28" fill="url(#hairGrad)"/>
        <!-- Face -->
        <rect x="24" y="28" width="56" height="44" rx="20" fill="#FFF5EE"/>
        <!-- Bangs -->
        <path d="M22,34 Q36,20 52,32 Q68,20 82,34 L82,24 Q52,12 22,24 Z" fill="url(#hairGrad)"/>
        <!-- Heterochromia eyes (Left Pink, Right Amber Gold) -->
        <ellipse cx="39" cy="49" rx="5.2" ry="6.2" fill="#EC4899"/>
        <circle cx="37.5" cy="46.8" r="2" fill="#FFFFFF"/>
        <ellipse cx="65" cy="49" rx="5.2" ry="6.2" fill="#F59E0B"/>
        <circle cx="63.5" cy="46.8" r="2" fill="#FFFFFF"/>
        <!-- Blush -->
        <ellipse cx="30" cy="57" rx="4.5" ry="2.4" fill="#F9A8D4" opacity="0.7"/>
        <ellipse cx="74" cy="57" rx="4.5" ry="2.4" fill="#F9A8D4" opacity="0.7"/>
        <!-- Cat smile -->
        <path d="M47,57 Q50,61 52,58 Q54,61 57,57" fill="none" stroke="#7C4D60" stroke-width="1.8" stroke-linecap="round"/>
        <!-- Little paws resting on dock bar -->
        <rect x="30" y="70" width="14" height="10" rx="5" fill="#FFF5EE" stroke="#DDD6FE" stroke-width="1"/>
        <rect x="60" y="70" width="14" height="10" rx="5" fill="#FFF5EE" stroke="#DDD6FE" stroke-width="1"/>
        <!-- Dock edge hint -->
        <rect x="8" y="78" width="88" height="4" rx="2" fill="url(#topAccent)" opacity="0.85"/>
      </g>
    </g>

    <!-- Center: Brand Title & Feature Pills -->
    <g transform="translate(262, 34)">
      <rect x="74" y="0" width="234" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#A78BFA" stroke-opacity="0.35"/>
      <circle cx="90" cy="12" r="3.5" fill="#F472B6"/>
      <text x="196" y="16" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="11.5" fill="#DDD6FE">Google Antigravity · Desktop Companion</text>

      <text x="191" y="72" text-anchor="middle" font-family="'Segoe UI', 'Microsoft YaHei UI', sans-serif" font-size="44" font-weight="800" fill="url(#titleGrad)" letter-spacing="1.5">AGY Pet</text>

      <text x="191" y="102" text-anchor="middle" font-family="'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="13.5" fill="#C4B5FD">透明桌面宠物 · 20 套趴框伴侣 · 多会话任务胶囊 · agy-fast 加速</text>

      <!-- Feature pills row -->
      <g transform="translate(-8, 122)" font-family="'Microsoft YaHei UI', 'PingFang SC', sans-serif" font-size="11" font-weight="600">
        <rect x="0" y="0" width="104" height="26" rx="13" fill="#6366F1" fill-opacity="0.22" stroke="#818CF8" stroke-opacity="0.5"/>
        <text x="52" y="17" text-anchor="middle" fill="#E0E7FF">114 段透明动画</text>

        <rect x="112" y="0" width="98" height="26" rx="13" fill="#EC4899" fill-opacity="0.18" stroke="#F472B6" stroke-opacity="0.45"/>
        <text x="161" y="17" text-anchor="middle" fill="#FCE7F3">自定义称呼互动</text>

        <rect x="218" y="0" width="88" height="26" rx="13" fill="#10B981" fill-opacity="0.18" stroke="#34D399" stroke-opacity="0.45"/>
        <text x="262" y="17" text-anchor="middle" fill="#D1FAE5">CDP 无损注入</text>

        <rect x="314" y="0" width="86" height="26" rx="13" fill="#F59E0B" fill-opacity="0.18" stroke="#FBBF24" stroke-opacity="0.45"/>
        <text x="357" y="17" text-anchor="middle" fill="#FEF3C7">5 语言 &amp; HUD</text>
      </g>
    </g>

    <!-- Right: Live Telemetry & Shortcut Mini Widget -->
    <g transform="translate(706, 32)">
      <rect x="0" y="0" width="140" height="156" rx="16" fill="#0F0D1D" fill-opacity="0.72" stroke="#A78BFA" stroke-opacity="0.3"/>
      <text x="70" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" fill="#A5B4FC" letter-spacing="1.2">CONTEXT &amp; PET</text>

      <!-- Context ring -->
      <circle cx="70" cy="72" r="28" fill="none" stroke="#2D264D" stroke-width="6"/>
      <circle cx="70" cy="72" r="28" fill="none" stroke="url(#ringGrad)" stroke-width="6" stroke-dasharray="152 176" stroke-linecap="round" transform="rotate(-90 70 72)"/>
      <text x="70" y="77" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#F8FAFC">86%</text>

      <!-- Hotkey hint pill -->
      <rect x="14" y="114" width="112" height="26" rx="13" fill="#1F1A3A" stroke="#818CF8" stroke-opacity="0.35"/>
      <text x="70" y="131" text-anchor="middle" font-family="'Microsoft YaHei UI', sans-serif" font-size="10.5" fill="#C4B5FD">S睡 · D待办 · W天气</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="878.5" height="218.5" rx="17.5" fill="none" stroke="#A78BFA" stroke-opacity="0.28" stroke-width="1.5"/>
</svg>
